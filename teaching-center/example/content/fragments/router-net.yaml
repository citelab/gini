id: router-net
layer: core
teaches: router test
spirit: different LANs talking with each other
summary: this is for student learning
provides:
- router-gateway
requires:
- network
objectives:
- id: place-router
  say: Place a router
  check: exists(router)
  level: 1
- id: link-router-switch-at-nets
  say: Wire the router to the switch (slot nets)
  check: link(router, switch@nets)
  level: 2
- id: live-host-at-nets-host-at-nets-ok
  say: 'Live: the machine (slot nets) reaches the machine (slot nets) (Run to check)'
  kind: behavioral
  probe: reach(host@nets -> host@nets) == ok
  level: 4
stage:
  name: test-01
  manual_addressing: false
  devices:
