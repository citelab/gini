id: router2
layer: core
teaches: routing
spirit: host on LAN A reaches a host on LAN B
summary: oute between two LANs
provides:
- router-gateway
requires:
- network
objectives:
- id: place-router
  say: Place a router
  check: exists(router)
  level: 1
- id: link-router-switch-at-A
  say: Wire the router to the switch (slot A)
  check: link(router, switch@A)
  level: 2
- id: link-router-switch-at-B
  say: Wire the router to the switch (slot B)
  check: link(router, switch@B)
  level: 2
- id: live-host-at-A-host-at-B-ok
  say: 'Live: the machine (slot A) reaches the machine (slot B) (Run to check)'
  kind: behavioral
  probe: reach(host@A -> host@B) == ok
  level: 4
