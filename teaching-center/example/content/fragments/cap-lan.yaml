id: cap-lan
layer: core
teaches: switching
spirit: M1 reaches M2 and the receiver sees the packets
summary: hosts talk via a switch
provides:
- host-node
- packet-visualizer
- request-client
- switched-segment
requires:
- traffic-sink
objectives:
- id: place-host
  say: Place at least 2 machine(s)
  check: count(host) >= 2
  level: 1
- id: place-switch
  say: Place a switch
  check: exists(switch)
  level: 1
- id: link-host-switch
  say: Wire the machine to the switch
  check: link(host, switch)
  level: 2
- id: out-packet_view-packets
  say: 'packet view: packets >= 1'
  kind: behavioral
  probe: measure(packet_view, packets) >= 1
  level: 4
stage:
  name: Default
  manual_addressing: false
  devices:
  - id: host-1
    type_key: host
    name: M1
    x: -98.0
    y: 244.0
    parent_id: null
    properties:
      Name: M1
      OS: linux
      Interfaces: '1'
      Toolkit: lean
    static_ips: {}
    size: 1
    w: 0.0
    h: 0.0
    slot: ''
  - id: host-2
    type_key: host
    name: M2
    x: 212.0
    y: 247.0
    parent_id: null
    properties:
      Name: M2
      OS: linux
      Interfaces: '1'
      Toolkit: lean
    static_ips: {}
    size: 1
    w: 0.0
    h: 0.0
    slot: ''
  - id: switch-3
    type_key: switch
    name: S1
    x: 75.0
    y: 52.0
    parent_id: null
    properties:
      Name: S1
      Priority: '100'
      MAC: ''
    static_ips: {}
    size: 1
    w: 0.0
    h: 0.0
    slot: ''
  - id: ping_probe-4
    type_key: ping_probe
    name: PING1
    x: -249.0
    y: 84.0
    parent_id: null
    properties:
      Name: PING1
      Target: ''
      Count: '0'
    static_ips: {}
    size: 1
    w: 0.0
    h: 0.0
    slot: ''
  - id: packet_view-5
    type_key: packet_view
    name: PCAP1
    x: 420.0
    y: 86.0
    parent_id: null
    properties:
      Name: PCAP1
      Interface: gini0
      Filter: ''
      Count: '0'
    static_ips: {}
    size: 1
    w: 0.0
    h: 0.0
    slot: ''
  links:
  - id: link-6
    source_id: switch-3
    target_id: host-1
    label: ''
    kind: link
  - id: link-7
    source_id: switch-3
    target_id: host-2
    label: ''
    kind: link
  - id: attach-8
    source_id: ping_probe-4
    target_id: host-1
    label: ''
    kind: attach
  - id: attach-9
    source_id: packet_view-5
    target_id: host-2
    label: ''
    kind: attach
engine_version: '6.0'
author: prof
certified: true
