# A Teaching Center lesson = a COMPOSITION BY REFERENCE.
#
# It names LOCAL fragment ids plus the framing; the student's GINI assembles it against its own
# trusted, verified fragments. The Center never ships foundational fragments (a new primitive would
# need a predicate the local oracle can't run), so anything a teacher releases is gradable by
# construction — and a reference this install doesn't have fails gracefully (the version check).
#
# The old hand-written objectives here were name-based (`connected(M1, M2)`) and silently failed
# whenever a student's devices weren't named M1/M2. Referencing a fragment avoids that entirely.
id: lab01-lan
title: 'Lab 1 — Build a switched LAN'
fragments:
  - basic-lan
genre: experience          # guided, full help — it's their first lab
time_limit: 20m
attempts: 3
brief: >
  Build a switched LAN: put two hosts on a switch, and give the segment a router as its gateway so
  traffic can leave the subnet.
