id: lab05-firewall
fragments:
- service-chain
genre: challenge
title: Lab 5 — Force traffic through the firewall
brief: Every packet to the Internet must cross the firewall. No bypass.
intent:
  goal: A chokepoint is only a chokepoint if there is no way around it.
  notes: Encourage them to deliberately add a bypass link and watch the check go red — the failure is
    the lesson.
  misconceptions:
  - Thinking a firewall next to the path protects anything.
