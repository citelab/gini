# An assignment, as data. Nothing in this file is special-cased in GINI: the Machine Lab reads it
# to know which files the student owns, what to seed, what to register in the build, and what the
# progress tracker shows. A new assignment is a new file like this one — a gini-core release, not
# a container image and not a gBuilder release.
#
# WHAT THIS IS NOT: the grade. Every check here is a pattern over the student's own source, so it
# answers "have you written the line" and never "does it work". A commented-out line does not
# count (comments are stripped before matching), but a syntactically valid line that is wrong
# still passes. Grading is the runtime comparison — see `grade:` at the end.

id: syscall-sysinfo
title: "Assignment 1 — a system call that reports system information"
machine_folder: xv6-lab          # ~/.gini/xv6-lab/<machine>/
syscall_number: 23               # the next free one; stock xv6 ends at SYS_sync = 22

# ---------------------------------------------------------------------------
# The files the student owns. Everything else in the kernel tree stays the
# image's, read-only, and cannot be broken.
# ---------------------------------------------------------------------------
files:
  - name: syscall.h       # host name, in the lab folder
    tree: kernel/syscall.h  # where it is linked into the kernel source
  - name: syscall.c
    tree: kernel/syscall.c
  - name: sysproc.c
    tree: kernel/sysproc.c
  - name: user.h
    tree: user/user.h
  - name: usys.pl
    tree: user/usys.pl

  # xv6-riscv has no sysinfo.h — MIT's 6.1810 supplies it. GINI ships it as part of the
  # assignment rather than patching the image, so the header travels with the lab.
  - name: sysinfo.h
    tree: kernel/sysinfo.h
    seed: |
      struct sysinfo {
        uint64 freemem;   // bytes of free memory
        uint64 nproc;     // processes whose state is not UNUSED
      };

  # The free list is a linked list of `struct run`, and that type is defined ONLY inside
  # kalloc.c. There is no way to walk it from anywhere else, which is exactly the point of
  # part B1 — so this file has to be theirs.
  - name: kalloc.c
    tree: kernel/kalloc.c
  - name: defs.h
    tree: kernel/defs.h

  # Their test program. `uprog` registers it in the Makefile's UPROGS from here, so the
  # student never edits the build system.
  - name: sysinfotest.c
    tree: user/sysinfotest.c
    uprog: sysinfotest
    seed: starter/sysinfotest.c

# ---------------------------------------------------------------------------
# The progress tracker, shown on the My Code face. Ordered; `part` groups them.
# `match` is a regular expression over the file with comments stripped.
# ---------------------------------------------------------------------------
checks:
  - id: number
    part: A
    label: "Give the call a number"
    where: kernel/syscall.h
    file: syscall.h
    match: '#define\s+SYS_sysinfo\s+\d+'
    hint: "The last one is SYS_sync 22."

  - id: extern
    part: A
    label: "Declare the kernel function"
    where: kernel/syscall.c
    file: syscall.c
    match: 'extern\s+uint64\s+sys_sysinfo\s*\(\s*void\s*\)'

  - id: dispatch
    part: A
    label: "Add it to the syscalls[] table"
    where: kernel/syscall.c
    file: syscall.c
    match: '\[\s*SYS_sysinfo\s*\]'
    hint: "Without this the call builds and then fails at runtime with 'unknown sys call'."

  - id: impl
    part: A
    label: "Write the kernel side"
    where: kernel/sysproc.c
    file: sysproc.c
    match: 'sys_sysinfo\s*\(\s*void\s*\)\s*\{'

  - id: prototype
    part: A
    label: "Declare it for your program"
    where: user/user.h
    file: user.h
    match: '\bsysinfo\s*\('

  - id: usys
    part: A
    label: "Generate the trampoline"
    where: user/usys.pl
    file: usys.pl
    match: 'entry\s*\(\s*"sysinfo"\s*\)'
    hint: "Miss this one and nothing fails until the LINKER: undefined reference to 'sysinfo'."

  - id: freemem
    part: B
    label: "Count free memory by walking kmem.freelist"
    where: kernel/kalloc.c
    file: kalloc.c
    match: 'kmem\.freelist'
    hint: "Free memory is a linked list, not a counter. Hold kmem.lock while you walk it."

  - id: freemem_decl
    part: B
    label: "Declare your counter so sysproc.c can call it"
    where: kernel/defs.h
    file: defs.h
    match: 'freemem|free_bytes|nfree'

  - id: copyout
    part: B
    label: "Return the struct with copyout"
    where: kernel/sysproc.c
    file: sysproc.c
    match: 'copyout\s*\('
    hint: "Five arguments in this xv6: copyout(pagetable, p->sz, dstva, src, len)."

# ---------------------------------------------------------------------------
# What is actually graded — measured while their code runs, not read from it.
# ---------------------------------------------------------------------------
grade:
  - id: named
    part: A
    describe: "The call appears by name in the System Calls Lab"
    metric: syscall_named
    expect: sysinfo

  - id: freemem_agrees
    part: B
    describe: "freemem matches what GINI reads from the page bitmap"
    metric: sysinfo_freemem_vs_free_pages
    tolerance_pages: 2       # allocation can move between the two reads

  - id: nproc_agrees
    part: B
    describe: "nproc matches the process table GINI reads"
    metric: sysinfo_nproc_vs_procs
    tolerance: 0
