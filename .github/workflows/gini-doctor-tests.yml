# Tests gini-doctor on all three platforms, at its Python floor and at a current Python, and the
# Health Center's pure half alongside it, because that half imports the doctor.
#
# Separate from tests.yml on purpose. That suite installs Qt and runs on Linux only; the doctor
# depends on nothing and its whole point is to run on every platform, including the Windows
# machines students bring. Stage 0 is tested here in its native shell on each runner: the POSIX
# script on Linux and macOS, the PowerShell script under Windows PowerShell 5.1 on Windows.
#
# uv provides the interpreters so the floor (3.8) is available on every runner image, including
# macOS on Apple silicon, where setup-python has no 3.8.
name: gini-doctor tests

on:
  push:
    paths: ["doctor/**", "healthcenter/**", ".github/workflows/gini-doctor-tests.yml"]
  pull_request:
    paths: ["doctor/**", "healthcenter/**", ".github/workflows/gini-doctor-tests.yml"]
  workflow_dispatch:

concurrency:
  group: doctor-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: doctor tests
        shell: bash
        run: uv run --no-project --python ${{ matrix.python }} --with pytest python -m pytest -q -rs doctor/tests
      # The Health Center's pure half imports the doctor's report model, its comparison, its policy
      # validator and its case codes, so a change on the doctor's side is what breaks it — and
      # nothing else in CI would notice. It runs here rather than in tests.yml because that suite is
      # Qt and Linux only, and one of these tests drives the real stage0.sh over a real socket.
      #
      # On the current Python only, deliberately: the 3.8 floor exists for the DOCTOR, which has to
      # run on whatever a lab machine has. A server has no reason to promise it, and testing there
      # would be asserting a floor nobody has chosen.
      - name: health center tests (they import the doctor)
        if: matrix.python == '3.12'
        shell: bash
        run: uv run --no-project --python ${{ matrix.python }} --with pytest python -m pytest -q -rs healthcenter/tests

      - name: the installed command works on this platform
        shell: bash
        run: |
          uv venv --python ${{ matrix.python }} .doctor-venv
          uv pip install --python .doctor-venv ./doctor
          if [ -x .doctor-venv/Scripts/gini-doctor.exe ]; then bin=.doctor-venv/Scripts/gini-doctor.exe; else bin=.doctor-venv/bin/gini-doctor; fi
          "$bin" run --only system,engine,perf --offline --stdout > report.json
          python -c "import json; r = json.load(open('report.json')); assert r['doctor']['engine'] == 'python', r; print(r['platform'], len(r['facts']), 'facts')"
