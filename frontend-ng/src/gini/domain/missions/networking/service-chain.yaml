id: service-chain
layer: core
teaches: sfc
spirit: traffic passes THROUGH a network function on its way out — a firewall sits in the path between
  the host and the Internet, by any valid wiring.
summary: Steer a host's traffic through a firewall to the Internet.
parent: nfv/sfc
provides:
- inline-nf
- perimeter-filter
- internet-egress
- service-endpoint
objectives:
- id: has-fw
  say: There is a firewall
  check: exists(firewall)
- id: host-reaches-fw
  say: A host's traffic reaches the firewall
  check: path(host, firewall)
- id: through-fw
  say: Traffic to the Internet passes through the firewall (no bypass)
  check: through(firewall, host, cloud)
misconceptions:
- Wiring the host straight to the Internet, bypassing the function.
peers:
- least-privilege
