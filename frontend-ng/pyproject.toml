[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "gini-toolkit"
dynamic = ["version"]        # derived from git tags by setuptools-scm (see [tool.setuptools_scm])
description = "GINI gBuilder — next-generation topology builder for computer networks and cloud computing experimentation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "GINI Toolkit" }]
# `pip install gini-toolkit` gives a runnable desktop app: engine + the PySide6/Qt GUI. The
# container runtime (Docker/Colima) and images are NOT pip-installable — gBuilder detects what is
# missing at launch and offers to bring them in (gini/services/bootstrap.py).
dependencies = [
    "gini-core>=6.3.2",          # A FLOOR, not a bare name: the two halves share a namespace and
    #                              a release number, and an older core beside a newer toolkit fails
    #                              at import, not at install. Raise it with any new gini.domain use.
    #                              the shared domain model + proof format. Split out so a headless
    #                              Teaching Center can install it without dragging in Qt, and so
    #                              there is exactly ONE copy of the format both sides must agree on.
    "PySide6-Essentials>=6.6",   # the Qt6 desktop GUI (gini.ui + the `gbuilder` entrypoint)
    "PySide6-Addons>=6.6",       # QtWebEngine — embeds headful Desktops / OS-Zoo screens (else the
    #                              system browser); QtWebSockets — the Terminal's link to ttyd.
    #                              Bundled so one install pulls it in automatically.
    "PyYAML>=6.0",               # reads authored Lesson packs (Missions / Teaching Center)
    "pyte>=0.8",                 # terminal emulation for the Terminal pane. Pure Python: it turns
    #                              the container's byte stream into a grid of cells, which
    #                              ui/terminal_view.py paints. Replaced an embedded xterm.js page
    #                              in QtWebEngine — a Chromium process per terminal.
]

[project.optional-dependencies]
agent = [
    "mcp>=1.0",          # Model Context Protocol server (in-app + external agents)
]
graph = [
    "matplotlib>=3.7",   # router / instance statistics graphing
    "numpy>=1.24",
]
dev = [
    "pytest>=7",
    "pytest-qt>=4",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
gbuilder = "gini.__main__:main"          # the desktop app
# `gini-setup` is gone: gBuilder now checks what the machine needs at launch and offers to do it
# (gini/services/bootstrap.py + gini/ui/first_run.py). The module stays for anyone with it in a
# script, but it is no longer a command a new user has to discover.

[tool.setuptools.packages.find]
where = ["src"]
# `gini` is an implicit NAMESPACE package shared with gini-core, which owns gini.domain. Neither
# distribution may ship gini/__init__.py, or one would shadow the other's half of the tree.
exclude = ["gini.domain*"]

[tool.setuptools.package-data]
"gini.ui" = ["assets/*.png", "assets/*.ico", "assets/*.icns"]

# Version comes from git tags (e.g. `git tag v6.1.0` -> 6.1.0). The repo root is one level up from
# this pyproject, hence root = "..". A generated _version.py is written into the package at build
# time (gitignored). Untagged working trees get e.g. 6.1.0.dev3+g<hash>.
[tool.setuptools_scm]
root = ".."
version_file = "src/gini/_version.py"
# drop the "+g<hash>" local segment: tagged clean builds -> 6.0.0; between-tag builds -> 6.0.1.dev0
local_scheme = "no-local-version"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
