[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "gini-doctor"
dynamic = ["version"]
description = "Diagnose a machine that should be able to run GINI: engine, compose, rootless, Qt, images, performance"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "GINI Toolkit" }]

# NO DEPENDENCIES, and that is the whole design of this package rather than an omission.
#
# The machine that needs a doctor is the machine where something is already wrong, so anything
# this had to install first is a way for it to be unavailable exactly when it is wanted. It does
# not depend on gini-core (which would tie a diagnostic to the version of the thing it diagnoses)
# and emphatically not on gini-toolkit, which carries PySide6 — an admin checking thirty lab
# machines should not be installing Qt to do it.
#
# The engine is a POSIX shell script shipped inside the wheel. `gini-doctor` is a three-line
# console script that hands it to `sh`, so the same file runs from a pipx install, from a git
# checkout, or piped over ssh by --fanout onto a machine with nothing installed at all.
dependencies = []

[project.urls]
Homepage = "https://github.com/citelab/gini"

[project.scripts]
gini-doctor = "gini_doctor.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# The script IS the package; a wheel without it installs a command that cannot run.
# The publish workflow asserts it is in there.
[tool.setuptools.package-data]
gini_doctor = ["*.sh", "stage0/*.sh", "stage0/*.ps1", "stage1/*.json"]

[tool.setuptools_scm]
root = ".."
