[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "gini-doctor"
dynamic = ["version"]
description = "Diagnose a machine that should be able to run GINI: engine, compose, rootless, Qt, images, performance"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "GINI Toolkit" }]

# NO DEPENDENCIES, and that is the whole design of this package rather than an omission.
#
# The machine that needs a doctor is the machine where something is already wrong, so anything
# this had to install first is a way for it to be unavailable exactly when it is wanted. It does
# not depend on gini-core (which would tie a diagnostic to the version of the thing it diagnoses)
# and emphatically not on gini-toolkit, which carries PySide6 — an admin checking thirty lab
# machines should not be installing Qt to do it.
#
# The doctor is Stage 1 (gini_doctor/stage1, standard library only, Python 3.8+), run in-process by
# `gini-doctor`. Stage 0 (gini_doctor/stage0: POSIX sh and PowerShell) exists for machines with
# nothing installed: it finds a usable Python and runs Stage 1 next to it, installed, or fetched as
# the single-file stage1-bundle.py. The legacy shell engine (gini-doctor.sh) still ships, reachable
# as `gini-doctor legacy`, until the Python doctor has matched it on the lab's Linux machines.
dependencies = []

[project.urls]
Homepage = "https://github.com/citelab/gini"

[project.scripts]
gini-doctor = "gini_doctor.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# Data the code needs at run time; a wheel without it installs a command that fails on first use.
# The publish workflow asserts each one is in there.
[tool.setuptools.package-data]
gini_doctor = ["*.sh", "stage0/*.sh", "stage0/*.ps1", "stage0/*.py", "stage1/*.json"]

[tool.setuptools_scm]
root = ".."
