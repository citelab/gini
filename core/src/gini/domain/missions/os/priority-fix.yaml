id: xv6-priority-fix
layer: core
teaches: os-scheduling
spirit: the shipped priority scheduler starves low-priority processes (it favours the lowest pid on
  ties and ages too weakly); a correct shadow keeps the highest-priority process served AND ages
  waiting processes so none starves forever.
summary: Fix the priority scheduler so high priority wins without starving anyone.
parent: os-scheduling
objectives:
- id: shadow-wired
  say: Your prio_sched shadow is running
  kind: behavioral
  probe: measure(shadow_active, prio_sched) == 1
- id: high-priority-served
  say: The highest-priority process gets its share of the CPU
  kind: behavioral
  probe: measure(cpu_share, highest_priority) >= 0.40
- id: no-starvation
  say: No runnable process is starved
  kind: behavioral
  probe: measure(max_wait_slices, any) <= 8
misconceptions:
- Strict priority with no aging starves low-priority processes forever.
- Breaking ties by pid makes the lowest pid look higher-priority than it is.
