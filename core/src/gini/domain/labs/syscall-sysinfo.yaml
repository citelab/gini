# A-Lab 01 — a system call that reports system information.
# The handout is docs/labs/a-lab-01-sysinfo.md; `where` and `hint` are its words.
id: syscall-sysinfo
title: "A-Lab 01 — sysinfo"
summary: "Add a system call that reports free memory, process counts and uptime."

# What each part IS. The face shows these beside the counts, because "A: 0/6" on
# its own tells a student nothing, and the handout already calls them Part A and B.
parts:
  A: "Add the system call"
  B: "Make it tell the truth"
  C: "Make it remember"
syscall_number: 23          # stock xv6 ends at SYS_sync = 22

files:
  - name: syscall.h
    tree: kernel/syscall.h
  - name: syscall.c
    tree: kernel/syscall.c
  - name: sysproc.c
    tree: kernel/sysproc.c
  - name: user.h
    tree: user/user.h
  - name: usys.pl
    tree: user/usys.pl
  - name: defs.h
    tree: kernel/defs.h

  # The free list is a chain of `struct run`, a type declared inside kalloc.c and nowhere else.
  # There is no way to walk kmem.freelist from another file, which is the lesson, not an obstacle.
  - name: kalloc.c
    tree: kernel/kalloc.c

  # Part C only. The timer is the one thing in the kernel that happens on its own, so it is the
  # only place a running average can be kept from. clockintr already walks the process table
  # under each p->lock — wakeup(&ticks) does it one line up — so the pattern is precedented in
  # the very function the student edits.
  - name: trap.c
    tree: kernel/trap.c

  # xv6-riscv has no sysinfo.h — MIT's 6.1810 supplies it. The assignment carries it instead of
  # the image, so the header travels with the lab.
  - name: sysinfo.h
    tree: kernel/sysinfo.h
    seed: |
      // The contract between your program and your kernel.
      //
      // The first two are worked through in the handout. The rest are yours: same walk, same
      // struct, different question — which is the point. Nothing here is stored by the kernel;
      // every number is derived by walking something.
      struct sysinfo {
        uint64 freemem;     // bytes of free memory
        uint64 nproc;       // processes whose state is not UNUSED
        uint64 nrunnable;   // ready to run but not running — the run queue
        uint64 nsleeping;   // blocked, waiting for something
        uint64 memused;     // bytes the processes are holding
        uint64 uptime;      // ticks since boot (a tick is about half a second here)
        // Part C. Averages of nrunnable over the last 5, 15 and 30 seconds — scaled by 100,
        // because the kernel has no floating point (it does not save FP registers on a context
        // switch, so it cannot use them). 250 means 2.50.
        uint64 load5;
        uint64 load15;
        uint64 load30;
      };

  - name: sysinfotest.c
    tree: user/sysinfotest.c
    uprog: sysinfotest
    seed: |
      #include "kernel/types.h"
      #include "kernel/sysinfo.h"
      #include "user/user.h"

      static void
      print_load(char *name, uint64 v)
      {
        printf("%s: %d.%d%d\n", name, (int)(v / 100), (int)(v / 10) % 10, (int)(v % 10));
      }

      int
      main(void)
      {
        struct sysinfo info;
        if (sysinfo(&info) < 0) {
          printf("sysinfo failed\n");
          exit(1);
        }
        printf("free bytes:  %d\n", (int)info.freemem);
        printf("processes:   %d\n", (int)info.nproc);
        printf("runnable:    %d\n", (int)info.nrunnable);
        printf("sleeping:    %d\n", (int)info.nsleeping);
        printf("mem in use:  %d\n", (int)info.memused);
        printf("uptime:      %d ticks\n", (int)info.uptime);
        // Part C. Printed a digit at a time: xv6's printf has no width or zero-padding, so
        // "%d.%d" turns 306 into 3.6 rather than 3.06 — a wrong number, quietly.
        print_load("load  5s", info.load5);
        print_load("load 15s", info.load15);
        print_load("load 30s", info.load30);
        exit(0);
      }

checks:
  - id: number
    part: A
    label: "Give the call a number"
    where: kernel/syscall.h
    file: syscall.h
    match: '#define\s+SYS_sysinfo\s+\d+'
    hint: "Add  #define SYS_sysinfo 23  — the name has to be sysinfo, because that is what your
      program and user.h call. The last one is SYS_sync 22."

  - id: extern
    part: A
    label: "Declare the kernel function"
    where: kernel/syscall.c
    file: syscall.c
    match: 'extern\s+uint64\s+sys_sysinfo\s*\('

  - id: dispatch
    part: A
    label: "Add a row to syscalls[]"
    where: kernel/syscall.c
    file: syscall.c
    match: '\[\s*SYS_sysinfo\s*\]'
    hint: "Without this it builds, then fails at runtime with 'unknown sys call 23'."

  - id: impl
    part: A
    label: "Write the kernel side"
    where: kernel/sysproc.c
    file: sysproc.c
    match: 'sys_sysinfo\s*\(\s*void\s*\)'

  - id: prototype
    part: A
    label: "Declare it for your program"
    where: user/user.h
    file: user.h
    match: '\bsysinfo\s*\('

  - id: usys
    part: A
    label: "Generate the trampoline"
    where: user/usys.pl
    file: usys.pl
    match: 'entry\s*\(\s*"sysinfo"\s*\)'
    hint: "Miss this and nothing fails until the LINKER: undefined reference to 'sysinfo'."

  # `edited`, not a pattern. Every pattern that would describe this work — kmem.freelist,
  # acquire(&kmem.lock) — is already in the untouched kalloc.c, because kalloc and kfree both use
  # them. A tick that is green before the student starts is worse than no tick at all.
  - id: freelist
    part: B
    kind: edited
    label: "Add a free-memory counter to kalloc.c"
    where: kernel/kalloc.c
    file: kalloc.c
    hint: "Free memory is a linked list, not a counter — walk kmem.freelist and hold kmem.lock."

  - id: declare_helper
    part: B
    label: "Declare your counter in defs.h"
    where: kernel/defs.h
    file: defs.h
    match: 'freemem|free_bytes|nfree|freebytes'

  - id: proc_table
    part: B
    label: "Walk the process table"
    where: kernel/sysproc.c
    file: sysproc.c
    match: 'extern\s+struct\s+proc\s+proc\s*\[|proc\s*\[\s*NPROC\s*\]'
    hint: "proc[] is reachable from here: extern struct proc proc[NPROC];"

  - id: runqueue
    part: B
    label: "Count the run queue (RUNNABLE) and the blocked ones (SLEEPING)"
    where: kernel/sysproc.c
    file: sysproc.c
    match: 'RUNNABLE'
    hint: "Same walk as nproc — you are already holding each p->lock. One pass, several counters."

  - id: uptime
    part: B
    label: "Report uptime in ticks"
    where: kernel/sysproc.c
    file: sysproc.c
    # NOT `tickslock`: sys_sleep already takes it in the untouched file, so that pattern is
    # green before the student starts. The declaration they have to add is the honest signal.
    match: 'extern\s+uint\s+ticks'
    hint: "`extern uint ticks;` at the top — and take tickslock while you read it, the way
      sys_sleep just above you does, because the timer writes it."

  - id: copyout
    part: B
    label: "Return the struct with copyout"
    where: kernel/sysproc.c
    file: sysproc.c
    match: 'copyout\s*\('
    hint: "Five arguments in this xv6: copyout(pagetable, p->sz, dstva, src, len)."

  - id: sampler
    part: C
    label: "Sample the run queue from the timer"
    where: kernel/trap.c
    file: trap.c
    match: 'load_sample\s*\('
    hint: "Call it from clockintr, AFTER release(&tickslock) — and define it at the end of the file."

  - id: ring
    part: C
    label: "Keep the samples in a ring buffer"
    where: kernel/trap.c
    file: trap.c
    match: 'loadring|load_ring'
    hint: "A fixed array plus an index that only ever goes up; % LOADN turns it into a ring."

  - id: average
    part: C
    label: "Average the last N samples"
    where: kernel/trap.c
    file: trap.c
    match: 'load_avg\s*\('
    hint: "x100 and integer division — the kernel has no floating point."

  - id: load_declared
    part: C
    label: "Declare the sampler and the average in defs.h"
    where: kernel/defs.h
    file: defs.h
    match: 'load_avg|load_sample'

grade:
  - id: named
    part: A
    describe: "sysinfo appears by name in the System Calls Lab"
    metric: syscall_named
    expect: sysinfo
  # The DELTA, not the absolute. Measured on a live machine: the two counts sit a few dozen pages
  # apart (they account for the edges of memory differently) but they move together exactly —
  # allocate 18 pages and both drop by 18. A delta is also immune to anything happening between
  # the two reads, which an absolute comparison is not.
  - id: freemem_tracks
    part: B
    describe: "freemem moves with allocation, by the amount GINI independently observes"
    metric: sysinfo_freemem_delta_vs_free_pages_delta
    tolerance: 2
  - id: freemem_plausible
    part: B
    describe: "freemem is a real count, not a constant"
    metric: sysinfo_freemem_vs_free_pages
    tolerance: 512
  - id: nproc_agrees
    part: B
    describe: "nproc matches the process table GINI reads"
    metric: sysinfo_nproc_vs_procs
    tolerance: 0
  - id: states_agree
    part: B
    describe: "nrunnable and nsleeping match the states GINI reads from the same table"
    metric: sysinfo_states_vs_procs
    tolerance: 1
  - id: uptime_agrees
    part: B
    describe: "uptime advances with the kernel's own tick"
    metric: sysinfo_uptime_advances
    tolerance: 1
  - id: load_responds
    part: C
    describe: "the 5s average rises when processes are made runnable, and the 30s average lags it"
    metric: sysinfo_load_responds
    tolerance: 1
